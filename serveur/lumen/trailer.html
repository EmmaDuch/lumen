<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>Bande-annonce</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #player { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<div id="player"></div>
<script>
  /* Page servie par le serveur LUMEN : YouTube exige une vraie adresse web pour ses lecteurs intégrés.
     L'appli TV l'affiche dans un cadre et la pilote par messages. */
  var VIDEO = "__VIDEO__", player = null;
  function post(type, data) { try { parent.postMessage({ lumen: 'trailer', type: type, data: data }, '*'); } catch (e) {} }
  var tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  tag.onerror = function () { post('error', 'youtube injoignable'); };
  document.head.appendChild(tag);
  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      videoId: VIDEO, width: '100%', height: '100%',
      playerVars: { autoplay: 1, controls: 0, rel: 0, playsinline: 1, iv_load_policy: 3, fs: 0, disablekb: 1, hl: 'fr', cc_lang_pref: 'fr' },
      events: {
        onReady: function (e) { e.target.playVideo(); post('ready'); },
        onStateChange: function (e) { post('state', e.data); },
        onError: function (e) { post('error', e.data); }
      }
    });
  }
  window.addEventListener('message', function (e) {
    var m = e.data || {};
    if (!player || !m.cmd || !player.getPlayerState) return;
    if (m.cmd === 'toggle') { if (player.getPlayerState() === 1) player.pauseVideo(); else player.playVideo(); }
    if (m.cmd === 'seek') player.seekTo(Math.max(0, player.getCurrentTime() + m.by), true);
    if (m.cmd === 'stop') player.stopVideo();
  });
</script>
</body>
</html>
